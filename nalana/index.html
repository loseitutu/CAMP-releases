<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#081916">
<meta name="mobile-web-app-capable" content="yes">
<!-- iPhone: open from the home screen as its own app, not a Safari tab. Standalone
     is also what exempts the data from Safari's 7-day storage cap. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Camp · Nalana">
<meta name="format-detection" content="telephone=no">
<title>Camp — Nalana</title>
<style>
/* ---- tokens ----
   Deep field green, widened steps for real separation.
   ONE accent (flare) for "act now". ONE state colour (gain) for "done".
   ONE alert (flag) used only for over-target. Nothing decorative.
   Radii: exactly three. 10 = control, 16 = surface, 999 = pip. */
:root{
  --ink:#081916;        /* page */
  --raise:#102A25;      /* surface */
  --edge:#1D423B;       /* border, input fill */
  --bone:#ECE5D5;       /* text */
  --dim:#95ABA4;        /* secondary text — 4.5:1 even on --edge */
  --ghost:#6C9489;      /* tertiary — 4.5:1 on --ink and --raise; not for text on --edge */
  --flare:#F5A524;      /* the only "do this now" colour */
  --gain:#63CDAA;       /* completed state only */
  --flag:#E4694A;       /* over/alert only */
  --r-ctl:10px;
  --r-surf:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,a{touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iPhone notch / Dynamic Island: a solid band under the status bar so sticky content never shows through it */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--ink);z-index:7;pointer-events:none}
html,body{margin:0;background:var(--ink);color:var(--bone);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:var(--bone)}
input,select,textarea{font:inherit;color:var(--bone);background:var(--edge);border:1px solid transparent;border-radius:var(--r-ctl);padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--flare)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2px solid var(--flare);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.wrap{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 24px max(18px,env(safe-area-inset-left))}
.meta{color:var(--dim);font-size:14px}
h1{font-size:32px;line-height:1.05;letter-spacing:-0.035em;font-weight:800;margin:10px 0 4px}
h2{font-size:21px;letter-spacing:-0.02em;font-weight:700;margin:26px 0 10px}
h3{font-size:17px;font-weight:700;margin:0}
h4{font-size:13px;font-weight:700;color:var(--dim);margin:18px 0 4px}
.sub{color:var(--dim);font-size:15px;margin-bottom:16px}
.date{color:var(--dim);font-size:15px;margin:0}
.today-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.today-nav button{color:var(--dim);font-size:14px;min-height:44px;padding:6px 14px;border-radius:var(--r-ctl);background:var(--raise)}
.today-nav .jump{color:var(--flare)}
.card{background:var(--raise);border-radius:var(--r-surf);padding:16px 18px;margin-top:12px}
.card h3+.meta{margin-top:2px}

/* ---- campaign header ---- */
.arc{display:flex;align-items:baseline;gap:10px;font-size:13px;color:var(--dim)}
.arc .phase{color:var(--flare);font-weight:700}
.arc .right{margin-left:auto;color:var(--ghost)}
.track{display:flex;gap:3px;margin:14px 0 6px}
.track i{flex:1;height:5px;border-radius:999px;background:var(--edge)}
.track i.past{background:var(--ghost)}
.track i.now{background:var(--flare)}
.track.long i{position:relative;overflow:hidden;background:var(--edge)}
.track.long i b{position:absolute;left:0;top:0;bottom:0;background:var(--ghost);border-radius:999px}
.track.long i.now b{background:var(--flare)}
.track-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ghost)}
.intro{color:var(--dim);font-size:14px;margin:12px 0 0}

/* ---- session list ---- */
.list{margin-top:6px;border-top:1px solid var(--edge)}
.grp{display:flex;justify-content:space-between;gap:10px;padding:12px 2px 0;font-size:12px;color:var(--ghost)}
.grp b{font-weight:700;color:var(--dim)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 2px;border-bottom:1px solid var(--edge)}
.row .mark{width:18px;flex:none;color:var(--ghost);font-size:15px;text-align:center}
.row.done .mark{color:var(--gain)}
.row .name{flex:1;font-size:16px}
.row .name small{display:block;color:var(--ghost);font-size:12px}
.row.done .name{color:var(--dim)}
.row .val{font-size:15px;color:var(--ghost);white-space:nowrap}
.row.done .val{color:var(--dim)}
.row.skipped .name,.row.skipped .val{color:var(--ghost);text-decoration:line-through;text-decoration-color:var(--ghost)}

/* ---- session strip: every exercise, always one tap away ---- */
.strip{position:sticky;top:env(safe-area-inset-top);overscroll-behavior-x:contain;z-index:3;background:var(--ink);margin:14px -18px 0;padding:8px 18px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--edge)}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;display:flex;align-items:center;gap:6px;max-width:160px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--raise);color:var(--dim);font-size:13px;white-space:nowrap}
.strip button span{overflow:hidden;text-overflow:ellipsis}
.strip button i{font-style:normal;font-size:12px;color:var(--ghost);flex:none}
.strip button.done{color:var(--ghost)}.strip button.done i{color:var(--gain)}
.strip button.skipped span{text-decoration:line-through}
.strip button.on{background:var(--bone);color:var(--ink);font-weight:700}.strip button.on i{color:var(--ink)}
.strip .sep{flex:none;width:1px;background:var(--edge);margin:4px 2px}
/* ---- the active exercise: compact, everything inside one screen ---- */
.active{background:var(--raise);border-radius:var(--r-surf);padding:14px 14px 12px;margin:10px 0;box-shadow:0 0 0 1px var(--edge) inset;scroll-margin-top:70px}
.active .top{display:flex;align-items:baseline;gap:10px}
.active h2{font-size:21px;letter-spacing:-0.02em;font-weight:800;margin:0;flex:1;line-height:1.15}
.active .rx{color:var(--bone);font-size:15px;font-weight:700;white-space:nowrap;text-align:right}
.active .alt{color:var(--dim);font-size:13px;margin-top:2px}
.active .note{color:var(--dim);font-size:13px;margin:6px 0 0}
.prev{margin-top:4px;font-size:13px;color:var(--ghost)}
.prev b{font-weight:600;color:var(--dim)}
.newtag{font-size:11px;font-weight:700;color:var(--ink);background:var(--flare);border-radius:999px;padding:2px 7px;vertical-align:3px;letter-spacing:0;margin-left:6px}
/* set chips: one per set, showing what was logged. Tap one to edit it. */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:8px;margin-top:12px}
.sets button{min-height:48px;padding:6px 4px;border-radius:var(--r-ctl);background:var(--ink);color:var(--ghost);text-align:center;font-size:12px;line-height:1.25;box-shadow:inset 0 0 0 1px var(--edge)}
.sets button b{display:block;font-size:14px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.sets button.hit b{color:var(--gain)}
.sets button.miss b{color:var(--ghost);text-decoration:line-through}
.sets button.here{box-shadow:inset 0 0 0 2px var(--flare);color:var(--flare)}
.sets button.here b{color:var(--bone)}
.entry{display:flex;align-items:flex-end;gap:8px;margin-top:12px}
.field{flex:1;min-width:0}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.field input{padding:9px 8px;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.times{color:var(--ghost);font-size:18px;padding-bottom:12px}
.unit{color:var(--dim);font-size:15px;padding-bottom:13px}
.step{flex:none;width:48px;padding:9px 0;border-radius:var(--r-ctl);background:var(--edge);color:var(--bone);font-size:22px;text-align:center;line-height:29px}
.tick{flex:none;min-width:56px;padding:9px 8px;border-radius:var(--r-ctl);background:var(--edge);color:var(--dim);font-size:15px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;line-height:29px}
.tick.on{background:var(--bone);color:var(--ink)}
.log{display:block;width:100%;margin-top:10px;padding:13px;border-radius:var(--r-ctl);background:var(--flare);color:#122;font-weight:800;font-size:16px;text-align:center}
.log:active{transform:translateY(1px)}
.aux{display:flex;gap:8px;margin-top:8px}
.aux button{flex:1;min-height:48px;padding:0 4px;border-radius:var(--r-ctl);background:var(--edge);color:var(--bone);font-size:13px;font-weight:600;text-align:center;white-space:nowrap}
.aux button.hl{box-shadow:inset 0 0 0 1px var(--flare);color:var(--flare)}
.aux button.on{background:var(--bone);color:var(--ink);font-weight:700}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
/* ---- bottom sheet: How to, History, Skip. Opens over the session, never replaces it ---- */
#sheet{position:fixed;inset:0;z-index:8;display:none}
#sheet.up{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:78vh;max-height:78dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--raise);border-radius:var(--r-surf) var(--r-surf) 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
#sheet .grab{width:40px;height:4px;border-radius:999px;background:var(--dim);opacity:.5;margin:4px auto 10px}
#sheet .panel{transition:transform .18s ease;touch-action:pan-y}
#sheet .panel.drag{transition:none}
/* while a number box has the keyboard up, the nav and rest bar get out of the way */
body.typing nav,body.typing #rest{visibility:hidden}
#sheet .sh-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#sheet .sh-h h3{flex:1;font-size:18px}
#sheet .sh-h button{min-height:44px;padding:0 16px;border-radius:var(--r-ctl);background:var(--edge);color:var(--dim);font-size:14px}
#sheet .guide{margin-top:0;border-top:0;padding-top:0}
.hist{margin:0;padding:0;list-style:none}
.hist li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--edge);font-size:14px}
.hist li:last-child{border-bottom:0}
.hist .hd{flex:none;width:82px;color:var(--dim)}
.hist .hs{flex:1;font-variant-numeric:tabular-nums}
.sheet-btns button{display:block;width:100%;margin-top:8px;min-height:48px;padding:12px;border-radius:var(--r-ctl);background:var(--edge);color:var(--bone);font-weight:600;text-align:center}
.sheet-btns button.warn{color:var(--flag)}
/* ---- the standing cue: part of the prescription, never hidden ---- */
.cue{display:flex;gap:10px;margin-top:8px;padding:4px 0 4px 10px;border-left:2px solid var(--flare);font-size:13px;line-height:1.4}
.cue b{color:var(--flare);font-weight:700}

/* ---- the guide: expands in place, never navigates away ---- */
.guide{margin-top:12px;border-top:1px solid var(--edge);padding-top:14px}
.guide dl{margin:0}
.guide dt{font-size:13px;color:var(--dim);margin-top:12px}
.guide dt:first-child{margin-top:0}
.guide dd{margin:3px 0 0;font-size:15px;line-height:1.5}
.guide ul{margin:3px 0 0;padding-left:18px;font-size:15px;line-height:1.5}
.guide li{margin:3px 0}
.guide .watch{display:flex;align-items:center;gap:10px;width:100%;margin-top:16px;padding:13px 14px;border-radius:var(--r-ctl);background:var(--edge);font-size:15px;color:var(--bone);text-decoration:none}
.guide .watch .tri{color:var(--flare);font-size:13px}
.guide .watch .away{margin-left:auto;color:var(--dim);font-size:12px}

/* bodyweight rung switch and its ladder */
.modes{display:flex;gap:6px;margin-top:10px}
.modes button{flex:1;min-height:44px;padding:10px 4px;border-radius:var(--r-ctl);background:var(--edge);color:var(--dim);font-size:13px;text-align:center}
.modes button.on{background:var(--bone);color:var(--ink);font-weight:700}
.ladder{margin-top:8px;font-size:12px;color:var(--dim)}
.ladder b{color:var(--flare)}
.gate{margin-top:12px;padding:12px 14px;border:1px solid var(--flare);border-radius:var(--r-ctl)}
.gate b{display:block;color:var(--flare);font-size:14px}
.gate .g-b{display:flex;gap:8px;margin-top:10px}
.gate .g-b button{flex:1;min-height:44px;padding:10px 0;border-radius:var(--r-ctl);background:var(--flare);color:var(--ink);text-align:center;font-size:14px;font-weight:700}
.gate .g-b button.ghost{background:var(--edge);color:var(--dim)}
.gate.win{border-color:var(--gain)}
.hidden-val{-webkit-text-security:disc;text-security:disc}
.goalbar{position:relative;height:10px;border-radius:5px;background:var(--edge);margin:14px 0 8px;overflow:hidden}.goalbar b{position:absolute;left:0;top:0;bottom:0;background:var(--gain);border-radius:5px}.goalbar i{position:absolute;top:0;bottom:0;width:2px;background:var(--bone);opacity:.6}
.gate.recal{margin-top:12px}.gate.recal.flag{border-color:var(--flag)}.gate.recal.flag b{color:var(--flag)}
.meta.trend{margin-top:6px}
.chainpick button{font-size:12px;line-height:1.25;min-height:44px}
.pick-l{margin-top:10px;font-size:12px}.pick-l+.modes{margin-top:4px}.gate.win b{color:var(--gain)}
.row+.gate{margin:4px 0 10px}
.flare-card{box-shadow:inset 0 0 0 1px var(--flag)}.flare-card h3{color:var(--flag)}
.cell.flare{box-shadow:inset 0 0 0 1px var(--flag)}
.dayrow .s.flare{color:var(--flag)}
.legend .flare::before{background:transparent;box-shadow:inset 0 0 0 1px var(--flag)}
.scale.score{flex-wrap:wrap}.scale.score button{min-width:40px;min-height:44px}

/* strength standards, inside the guide */
.std{margin-top:14px;padding-top:12px;border-top:1px solid var(--edge)}
.std-h{font-size:12.5px;color:var(--dim)}
.std-g{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-top:8px}
.std-g div{background:var(--ink);border-radius:var(--r-ctl);padding:8px 4px;text-align:center}
.std-g small{display:block;color:var(--dim);font-size:11px}
.std-g b{font-size:13px;line-height:1.2;display:block;margin-top:2px}
.std-you{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13.5px;gap:8px;flex-wrap:wrap}
.lv{padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--edge);color:var(--dim)}
.lv3,.lv4{background:var(--bone);color:var(--ink)}

/* ---- session-level ---- */
.notes{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--dim)}
.notes li{margin-bottom:6px}
.notes b{color:var(--bone)}
.mt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mt .time{font-size:28px;font-weight:800;letter-spacing:-0.02em}
.seg{display:flex;gap:6px}
.seg button{padding:8px 12px;border-radius:var(--r-ctl);background:var(--edge);color:var(--dim);font-size:14px}
.seg button.on{background:var(--bone);color:var(--ink);font-weight:700}
.altbox{margin-top:12px;padding-top:12px;border-top:1px solid var(--edge);font-size:15px}
.altbox b{color:var(--flare)}
.primary{display:block;width:100%;margin-top:16px;padding:16px;border-radius:var(--r-ctl);background:var(--flare);color:#122;font-weight:800;font-size:17px;text-align:center}
.primary.done{background:var(--gain)}
.secondary{display:block;width:100%;margin-top:10px;min-height:48px;padding:12px;border-radius:var(--r-ctl);background:var(--edge);color:var(--bone);font-weight:700;text-align:center}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--edge);color:var(--dim)}
.pill.now{background:var(--flare);color:var(--ink)}
.wk{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.wk button{color:var(--dim);min-width:44px;min-height:44px;padding:6px 12px;text-align:center;background:var(--raise);border-radius:var(--r-ctl);font-size:18px}
.dayrow{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--edge);width:100%}
.dayrow .d{font-weight:700}.dayrow .d small{display:block;color:var(--dim);font-weight:400;font-size:12px}
.dayrow .t{font-weight:600}.dayrow .t small{display:block;color:var(--dim);font-weight:400;font-size:13px}
.dayrow .s{color:var(--dim);font-size:13px;text-align:right}
.dayrow.isToday .d{color:var(--flare)}.dayrow .s.ok{color:var(--gain);font-weight:700}
.dayrow .s.skip{color:var(--ghost);font-weight:700}
.dayrow .s small{display:block;color:var(--dim);font-weight:400;font-size:12px}
.dayrow.isSkipped .t,.dayrow.isSkipped .d{opacity:.55}
.cal{margin-top:10px}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);color:var(--dim);font-size:12px;text-align:center;margin-bottom:6px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1/1.15;border-radius:var(--r-ctl);background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;color:var(--bone);position:relative}
.cell.out{visibility:hidden}.cell .bar{width:60%;height:4px;border-radius:999px;background:var(--c)}
.cell.isToday{outline:2px solid var(--flare);outline-offset:-2px}
.cell.done::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:999px;background:var(--gain)}
.cell.pre{opacity:.35}
.cell.skipped{box-shadow:inset 0 0 0 1px var(--ghost)}
.cell.skipped span:first-child{color:var(--ghost);text-decoration:line-through}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px;font-size:13px;color:var(--dim)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.legend .skip::before{background:transparent;box-shadow:inset 0 0 0 1px var(--ghost)}
.rows .row{display:block;padding:12px 0;border-bottom:1px solid var(--edge)}.rows .row:last-child{border-bottom:0}
.big{font-size:40px;font-weight:800;letter-spacing:-0.03em;line-height:1}
.big small{font-size:15px;color:var(--dim);font-weight:400;letter-spacing:0;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--raise);border-radius:var(--r-surf);padding:14px 16px}
.stat .l{color:var(--dim);font-size:13px}.stat .v{font-size:24px;font-weight:800;letter-spacing:-0.02em;margin-top:2px}
.stat .v.over{color:var(--flag)}
.inline{display:flex;gap:8px;margin-top:10px}.inline input{flex:1}
.inline button{background:var(--flare);color:var(--ink);font-weight:700;padding:10px 16px;border-radius:var(--r-ctl);white-space:nowrap}
svg.chart{width:100%;height:190px;display:block;margin-top:8px}
.pr{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--edge)}.pr:last-child{border-bottom:0}.pr b{color:var(--bone)}
.macro{margin-top:14px}.macro .lab{display:flex;justify-content:space-between;font-size:14px}
.bar-bg{height:10px;border-radius:999px;background:var(--edge);margin-top:6px;overflow:hidden}
.bar-fg{height:100%;border-radius:999px;background:var(--dim);transition:width .25s}.bar-fg.met{background:var(--gain)}.bar-fg.over{background:var(--flag)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.quick button{min-height:44px;padding:8px 14px;border-radius:999px;background:var(--edge);font-size:14px}
.quick button.mine{box-shadow:inset 0 0 0 1px var(--dim)}
.quick button small{color:var(--dim)}
.quick button.del{background:transparent;box-shadow:inset 0 0 0 1px var(--flag);color:var(--flag)}
.meal{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--edge);font-size:15px}.meal:last-child{border-bottom:0}
.meal .m{color:var(--dim);font-size:13px}.meal button{color:var(--dim);padding:4px 8px}
.form4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:10px}
.form4 input{text-align:center;padding:10px 4px}
.form4 label,.form2 label{font-size:12px;color:var(--dim);display:block;text-align:center;margin-bottom:4px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.note{font-size:14px;color:var(--dim);margin-top:12px}.note b{color:var(--bone)}
.skipped-card{background:transparent;box-shadow:inset 0 0 0 1px var(--edge)}
.skipped-card h3{color:var(--dim)}
.skipnote{margin-top:10px;padding:8px 0 8px 12px;border-left:2px solid var(--dim);font-size:15px;white-space:pre-wrap;word-break:break-word}
textarea.notebox{margin-top:10px;font-size:16px;min-height:84px;resize:vertical}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--edge)}
.tog .tl{font-weight:650;font-size:15px}
.tog .tl small{display:block;color:var(--dim);font-size:13px;font-weight:400;margin-top:2px}
.tog button{flex:none;width:66px;min-height:44px;padding:9px 0;border-radius:999px;background:var(--edge);color:var(--dim);text-align:center;font-size:13px;font-weight:700}
.tog button.on{background:var(--bone);color:var(--ink)}
.scale{display:flex;gap:5px;margin-top:10px}
.scale button{flex:1;padding:9px 0;border-radius:var(--r-ctl);background:var(--edge);color:var(--dim);text-align:center;font-size:14px}
.scale button.on{background:var(--bone);color:var(--ink);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);border-top:1px solid var(--edge);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;color:var(--ghost);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--bone)}
.hidden{display:none}
.warnbar{background:var(--flag);color:var(--ink);padding:12px 18px;font-size:14px;line-height:1.35}
.warnbar b{display:block;font-size:15px;margin-bottom:2px}
.warnbar button{background:var(--ink);color:var(--bone);font-weight:700;font-size:14px;padding:8px 12px;border-radius:var(--r-ctl);margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--bone);color:var(--ink);padding:10px 16px;border-radius:var(--r-ctl);font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.toast.show{opacity:1}

/* ---- rest timer: a slim bar above the nav, never over the work ---- */
#rest{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:4;max-width:500px;margin:0 auto;background:var(--edge);border-radius:var(--r-ctl);overflow:hidden;transform:translateY(calc(100% + 90px + env(safe-area-inset-bottom)));transition:transform .2s ease;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#rest.up{transform:none;pointer-events:auto}
#rest .drain{position:absolute;left:0;top:0;bottom:0;background:rgba(245,165,36,.16)}
#rest .line{position:relative;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px}
#rest .clock{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;line-height:1;min-width:58px}
#rest .of{color:var(--bone);font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rest button{min-height:44px;min-width:56px;padding:0 12px;text-align:center;border-radius:8px;background:var(--raise);color:var(--bone);font-size:14px;font-weight:600}
#rest.over{background:#3a2a12}
#rest.over .clock{color:var(--flare);animation:pulse 1s ease-in-out 3}
#rest.over .of{color:var(--flare)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
body.resting{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
body.resting .toast{bottom:calc(140px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app" class="wrap"></div>
<div id="rest" role="timer" aria-label="Rest timer"></div>
<div id="sheet" aria-hidden="true"></div>
<nav id="nav"></nav>
<div id="toast" class="toast"></div>

<script>
/* ---------------- storage ---------------- */
/* Versioned storage for CAMP.
 *
 * Every value we keep in localStorage is written inside an envelope:
 *
 *   { "schemaVersion": 6, "data": <the value the app actually uses> }
 *
 * Saves written before this layer existed are bare values with no envelope.
 * Those are version 1 by definition — a missing version means 1, never 0 and
 * never "unknown".
 *
 * On load, run() reads the stored version, applies every migration in order up
 * to CURRENT_VERSION, and writes the result back. Migrations live in
 * MIGRATIONS, ordered, each a pure function from the previous whole-store shape
 * to the next one. The runner does the stamping, so a migration that changes
 * nothing is genuinely a no-op.
 *
 * The two rules that matter, because this is somebody's only copy of their
 * training log:
 *
 *   - The untouched original is copied to ROLLBACK_KEY before the first
 *     migration runs. One copy, overwritten each time.
 *   - If anything throws, no data key is written at all. Half-migrated is worse
 *     than un-migrated, so the store is left exactly as it was found and the
 *     caller is told to send the user to the Data tab for a backup.
 *
 * A migration that cannot work from the snapshot alone gets a context object as
 * its second argument: options.exerciseAt lets it ask the app which exercise a
 * log slot holds, options.startDate is the profile's start date for the v6
 * backfill, and ctx.note() is where it reports anything it could not classify.
 * Notes come back on the result. up() stays a pure function of its two
 * arguments — ctx.note is a reporting sink, never data.
 *
 * Loaded as a plain script (spliced into the app) it defines CampCore; under
 * node it also exports it, which is what build/check-migrations.js drives.
 */
var CampCore = (function () {
  'use strict';

  var CURRENT_VERSION = 6;

  /* Every localStorage key the app owns. Order is the write order. app is
   * state the app owns and the user does not edit as a setting: the start
   * date, and later whatever else has to survive a rebuilt page. */
  var KEYS = ['logs', 'weight', 'waist', 'hip', 'macros', 'quick', 'settings', 'app'];

  var ROLLBACK_KEY = 'camp.rollback';

  /* Settings that are the same for everybody — the rest timer and its alerts —
   * rather than part of a person's profile. The app merges these under whatever
   * is stored, and the v3 migration writes them into stores that predate them,
   * so there is exactly one place a default lives. */
  var SETTINGS_DEFAULTS = {
    restAuto: true,
    restDefault: 90,
    restSound: true,
    restVibrate: true
  };

  var FAIL_MESSAGE =
    'Your saved data could not be updated to the new format, so nothing was ' +
    'changed — everything is still there exactly as it was. Open the Data tab ' +
    'and save a backup file before you carry on.';

  /* Ordered. Each entry migrates the whole-store snapshot
   * { logs, weight, waist, hip, macros, quick, settings } from .from to .to.
   * up() must be pure: build a new object, never mutate the argument. */
  var MIGRATIONS = [
    {
      from: 1,
      to: 2,
      name: 'stamp-schema-version',
      /* No shape change. Version 2 is version 1 with the envelope around it,
       * which the runner writes. This exists so the mechanism ships exercised
       * instead of sitting untested until the first real change. */
      up: function (snapshot) { return Object.assign({}, snapshot); }
    },
    {
      from: 2,
      to: 3,
      name: 'settings-defaults-and-session-skip',
      /* Two shapes change together. settings gains the rest-timer and alert
       * keys — anything already stored wins, so a person who has set something
       * keeps it. Every log entry gains an explicit skipped:null, so "not
       * skipped" is a value in the store rather than a missing key. */
      up: function (snapshot) {
        var out = Object.assign({}, snapshot);
        out.settings = Object.assign({}, SETTINGS_DEFAULTS, snapshot.settings || {});
        var logs = snapshot.logs;
        if (logs !== null && typeof logs === 'object' && !Array.isArray(logs)) {
          var next = {};
          for (var k in logs) {
            if (!Object.prototype.hasOwnProperty.call(logs, k)) continue;
            var entry = logs[k];
            next[k] = (entry !== null && typeof entry === 'object' && !Array.isArray(entry))
              ? Object.assign({ skipped: null }, entry)
              : entry;
          }
          out.logs = next;
        }
        return out;
      }
    },
    {
      from: 3,
      to: 4,
      name: 'stamp-set-metrics',
      /* Every logged set gains m, the metric it was measured in, so a stored set
       * can be read without knowing which day template it came from.
       *
       * Sets are stored under the day's slot index, not an exercise name, so the
       * only way to know what a slot holds is to ask the app: ctx.exerciseAt.
       * Without it — restoring a backup outside the app, say — nothing is
       * stamped and every set is reported. Nothing is ever guessed.
       *
       * What each case does, and why:
       *   - a skip measures nothing, so it is left exactly as it is
       *   - a bodyweight movement with a weight stored against it is ambiguous:
       *     the old logger had one "lb" box, so that number is either machine
       *     assistance or weight on a belt. That is two different rungs and
       *     nothing in the store says which, so the set is left unstamped and
       *     reported for the user to look at
       *   - a bodyweight movement with no weight stored is bodyweight reps:
       *     no external load was recorded, so there is none to lose
       *   - a hold, a hold per side or a duration gets its metric stamped, but
       *     the old logger only ever wrote reps, so the number itself may not be
       *     seconds or minutes. The metric is stamped, the number is left alone,
       *     and the set is reported
       */
      up: function (snapshot, ctx) {
        var out = Object.assign({}, snapshot);
        var logs = snapshot.logs;
        if (!isPlainObject(logs)) return out;

        var exerciseAt = (ctx && ctx.exerciseAt) || null;
        var note = (ctx && ctx.note) || function () {};
        var nextLogs = {};

        for (var dateKey in logs) {
          if (!Object.prototype.hasOwnProperty.call(logs, dateKey)) continue;
          var day = logs[dateKey];
          if (!isPlainObject(day) || !isPlainObject(day.sets)) { nextLogs[dateKey] = day; continue; }

          var nextSets = {};
          for (var slot in day.sets) {
            if (!Object.prototype.hasOwnProperty.call(day.sets, slot)) continue;
            var arr = day.sets[slot];
            if (!Array.isArray(arr)) {
              nextSets[slot] = arr;
              note({ date: dateKey, slot: slot, reason: 'the sets for this slot are not a list, so it was left untouched' });
              continue;
            }

            var nextArr = [];
            for (var i = 0; i < arr.length; i++) {
              var set = arr[i];
              nextArr.push(set);
              if (set === null || set === undefined) continue;      /* an unlogged set */
              if (!isPlainObject(set)) {
                note({ date: dateKey, slot: slot, set: i, reason: 'this is not a set object, so it was left untouched' });
                continue;
              }
              if ('m' in set) continue;                             /* already stamped */
              if (set.skip) continue;                               /* a skip measures nothing */

              var ex = exerciseAt ? exerciseAt(dateKey, slot) : null;
              if (!ex || !ex.metric) {
                note({ date: dateKey, slot: slot, set: i, name: (ex && ex.name) || null,
                  reason: exerciseAt
                    ? 'no exercise with a metric is known for this day and slot, so the set was left untouched'
                    : 'the app was not there to say which exercise this slot holds, so the set was left untouched' });
                continue;
              }

              var read = readLegacySet(ex.metric, set);
              if (!read.metric) {
                note({ date: dateKey, slot: slot, set: i, name: ex.name, reason: read.reason });
                continue;
              }
              if (read.reason) note({ date: dateKey, slot: slot, set: i, name: ex.name, reason: read.reason });
              nextArr[i] = Object.assign({}, set, { m: read.metric });
            }
            nextSets[slot] = nextArr;
          }
          nextLogs[dateKey] = Object.assign({}, day, { sets: nextSets });
        }

        out.logs = nextLogs;
        return out;
      }
    },
    {
      from: 4,
      to: 5,
      name: 'stamp-skip-levels',
      /* Every skipped set gains level, the level it was skipped at. Until now
       * the only skip a set could carry was the Skip button's {skip:1}, one set
       * at a time, so every skip already stored is level "set". From v5 the
       * Skip exercise button writes {skip:1, level:"exercise"} against every
       * remaining set of a movement, and Undo skip takes back exactly those.
       *
       * A session skip is not a set and is not touched: it lives on the day as
       * skipped:{reason, at} and already says what it is. Everything that is
       * not a {skip:1} entry is left exactly as it is, including the old
       * logger's empty entries, which the app already reads as skips. */
      up: function (snapshot) {
        var out = Object.assign({}, snapshot);
        var logs = snapshot.logs;
        if (!isPlainObject(logs)) return out;

        var nextLogs = {};
        for (var dateKey in logs) {
          if (!Object.prototype.hasOwnProperty.call(logs, dateKey)) continue;
          var day = logs[dateKey];
          if (!isPlainObject(day) || !isPlainObject(day.sets)) { nextLogs[dateKey] = day; continue; }

          var nextSets = {};
          for (var slot in day.sets) {
            if (!Object.prototype.hasOwnProperty.call(day.sets, slot)) continue;
            var arr = day.sets[slot];
            if (!Array.isArray(arr)) { nextSets[slot] = arr; continue; }
            var nextArr = [];
            for (var i = 0; i < arr.length; i++) {
              var set = arr[i];
              nextArr.push(set);
              if (!isPlainObject(set) || !set.skip) continue;
              if (typeof set.level === 'string') continue;          /* already stamped */
              nextArr[i] = Object.assign({}, set, { level: 'set' });
            }
            nextSets[slot] = nextArr;
          }
          nextLogs[dateKey] = Object.assign({}, day, { sets: nextSets });
        }

        out.logs = nextLogs;
        return out;
      }
    },
    {
      from: 5,
      to: 6,
      name: 'app-state-start-date',
      /* The store gains an app key: state the app owns that is neither a log
       * nor a setting the user edits. Its first field is startDate, the Monday
       * the program is counted from. Until now that date was a constant baked
       * into the page; from v6 the page reads it from here, so a rebuilt page
       * cannot move anyone's weeks.
       *
       * It is backfilled from ctx.startDate — the profile's date, handed over
       * by the app — so an existing install comes through on exactly the week
       * it was on. With nobody to ask (a backup restored outside the app) it is
       * null and the app falls back to the profile's date at runtime. An app
       * key already present keeps everything it has; only a missing startDate
       * is filled in. Nothing else in the store is touched. */
      up: function (snapshot, ctx) {
        var out = Object.assign({}, snapshot);
        var app = isPlainObject(snapshot.app) ? Object.assign({}, snapshot.app) : {};
        if (!('startDate' in app)) {
          app.startDate = (ctx && typeof ctx.startDate === 'string') ? ctx.startDate : null;
        }
        out.app = app;
        return out;
      }
    }
  ];

  function isPlainObject(v) {
    return v !== null && typeof v === 'object' && !Array.isArray(v);
  }

  /* A set written by the logger that only ever had a "lb" box and a "reps" box,
   * read against the metric its exercise actually uses. Returns the metric to
   * stamp, or no metric and the reason it could not be told. A reason alongside
   * a metric means "stamped, but look at this one". */
  function readLegacySet(metric, set) {
    var hasLoad = typeof set.w === 'number' && isFinite(set.w) && set.w !== 0;

    if (metric === 'bodyweight_reps' || metric === 'loaded_bodyweight' || metric === 'assisted_bodyweight') {
      if (hasLoad) {
        return { metric: null, reason: 'a bodyweight movement with ' + set.w + ' lb stored against it — the old ' +
          'logger had one weight box, so that is either machine assistance or weight on a belt, and nothing ' +
          'stored says which. Left untouched: re-log it to say which rung it was' };
      }
      return { metric: 'bodyweight_reps', reason: null };
    }
    if (metric === 'hold' || metric === 'hold_each_side') {
      return { metric: metric, reason: 'stamped as a hold, but the old logger wrote reps — check whether ' +
        (set.r == null ? 'the stored value' : set.r) + ' is seconds' };
    }
    if (metric === 'duration') {
      return { metric: 'duration', reason: 'stamped as a duration, but the old logger wrote reps — check whether ' +
        (set.r == null ? 'the stored value' : set.r) + ' is minutes' };
    }
    if (metric === 'reps_only') {
      if (hasLoad) {
        return { metric: 'reps_only', reason: 'stamped as reps, but ' + set.w + ' lb is stored against a movement ' +
          'that carries no external load — the weight was kept, nothing reads it' };
      }
      return { metric: 'reps_only', reason: null };
    }
    return { metric: 'weight_reps', reason: null };
  }

  function storeError(message) {
    var e = new Error(message);
    e.campStore = true;
    return e;
  }

  function isEnvelope(v) {
    return v !== null && typeof v === 'object' && !Array.isArray(v) &&
      typeof v.schemaVersion === 'number' && 'data' in v;
  }

  /* The value as stored. */
  function wrap(value, version) {
    return { schemaVersion: version == null ? CURRENT_VERSION : version, data: value };
  }

  /* The value as the app wants it, whether or not it was ever stamped. */
  function unwrap(parsed) {
    return isEnvelope(parsed) ? parsed.data : parsed;
  }

  function versionOf(parsed) {
    return isEnvelope(parsed) ? parsed.schemaVersion : 1;
  }

  /* Reads every key out of the backend. Throws if anything stored is not
   * readable JSON — unreadable is not the same as absent, and guessing which
   * one it is would lose data. The lowest version found wins, so a store that
   * was half-written by some earlier failure still gets every migration it
   * needs. An empty store is already current: there is nothing to migrate. */
  function readStore(backend) {
    var raw = {}, data = {}, version = null, present = 0;
    for (var i = 0; i < KEYS.length; i++) {
      var k = KEYS[i];
      var s = backend.getItem(k);
      raw[k] = s;
      if (s == null) continue;
      present++;
      var parsed;
      try {
        parsed = JSON.parse(s);
      } catch (e) {
        throw storeError('"' + k + '" is not readable JSON');
      }
      data[k] = unwrap(parsed);
      var v = versionOf(parsed);
      if (version === null || v < version) version = v;
    }
    return { raw: raw, data: data, present: present, version: present ? version : CURRENT_VERSION };
  }

  function applyMigrations(data, from, migrations, ctx) {
    var cur = data, v = from, applied = [];
    for (var i = 0; i < migrations.length; i++) {
      var m = migrations[i];
      if (m.from < v) continue;
      if (m.from !== v) {
        throw storeError('no migration from version ' + v + ' (next one starts at ' + m.from + ')');
      }
      cur = m.up(cur, ctx);
      if (cur === null || typeof cur !== 'object') {
        throw storeError('migration "' + m.name + '" returned ' + cur + ' instead of a store');
      }
      v = m.to;
      applied.push(m.name);
    }
    return { data: cur, version: v, applied: applied };
  }

  /* What a migration gets as its second argument. exerciseAt comes from the
   * caller — only the app knows what a log slot holds — and note() collects
   * everything a migration could not classify, which run() and migrate() hand
   * back so the app can put it in front of the user. */
  function context(options) {
    var notes = [];
    return {
      notes: notes,
      ctx: {
        exerciseAt: (options && options.exerciseAt) || null,
        startDate: (options && typeof options.startDate === 'string') ? options.startDate : null,
        note: function (n) { notes.push(n); }
      }
    };
  }

  function fail(err, context) {
    var msg = (err && err.message) ? err.message : String(err);
    return {
      ok: false,
      migrated: false,
      version: null,
      applied: [],
      error: context ? context + ': ' + msg : msg,
      message: FAIL_MESSAGE,
      notes: []
    };
  }

  /* Pure: migrate a snapshot in memory, touching no storage. Used for restoring
   * a backup file written by an older version of the app. */
  function migrate(data, from, options) {
    var migrations = (options && options.migrations) || MIGRATIONS;
    var c = context(options);
    try {
      var r = applyMigrations(data, from == null ? 1 : from, migrations, c.ctx);
      return { ok: true, migrated: r.applied.length > 0, version: r.version, applied: r.applied, data: r.data, notes: c.notes };
    } catch (e) {
      return fail(e);
    }
  }

  /* Migrate the backend in place. Returns a result, never throws. */
  function run(backend, options) {
    var migrations = (options && options.migrations) || MIGRATIONS;
    var target = (options && options.target) || CURRENT_VERSION;
    var c = context(options);

    var s;
    try {
      s = readStore(backend);
    } catch (e) {
      return fail(e);
    }

    /* Already current, or newer than this build understands. Either way there
     * is nothing to apply, so write nothing — not even a rollback copy. */
    if (s.version >= target) {
      return { ok: true, migrated: false, version: s.version, applied: [], error: null, message: null, notes: [] };
    }

    try {
      backend.setItem(ROLLBACK_KEY, JSON.stringify({
        savedAt: new Date().toISOString(),
        version: s.version,
        keys: s.raw
      }));
    } catch (e) {
      return fail(e, 'could not save the rollback copy');
    }

    var r;
    try {
      r = applyMigrations(s.data, s.version, migrations, c.ctx);
    } catch (e) {
      return fail(e);
    }

    /* Serialise everything before writing anything, so a value that will not
     * stringify fails while the store is still untouched. */
    var payload = [];
    try {
      for (var i = 0; i < KEYS.length; i++) {
        var k = KEYS[i];
        if (!(k in r.data)) continue;
        payload.push([k, JSON.stringify(wrap(r.data[k], r.version))]);
      }
    } catch (e) {
      return fail(e, 'migrated data could not be serialised');
    }

    var written = [];
    try {
      for (var j = 0; j < payload.length; j++) {
        backend.setItem(payload[j][0], payload[j][1]);
        written.push(payload[j][0]);
      }
    } catch (e) {
      /* Out of quota part-way through. Put back exactly what was there. */
      for (var w = 0; w < written.length; w++) {
        var key = written[w];
        if (s.raw[key] == null) backend.removeItem(key);
        else backend.setItem(key, s.raw[key]);
      }
      return fail(e, 'migrated data could not be written');
    }

    return { ok: true, migrated: true, version: r.version, applied: r.applied, error: null, message: null, notes: c.notes };
  }

  return {
    CURRENT_VERSION: CURRENT_VERSION,
    KEYS: KEYS,
    SETTINGS_DEFAULTS: SETTINGS_DEFAULTS,
    ROLLBACK_KEY: ROLLBACK_KEY,
    FAIL_MESSAGE: FAIL_MESSAGE,
    MIGRATIONS: MIGRATIONS,
    isEnvelope: isEnvelope,
    wrap: wrap,
    unwrap: unwrap,
    versionOf: versionOf,
    migrate: migrate,
    run: run
  };
})();

if (typeof module === 'object' && module.exports) module.exports = CampCore;
const mem={};
/* set() falls back to memory when the device refuses the write, and also when
 * the migration failed — writing over data we could not read is how you turn a
 * recoverable problem into a lost training log. */

 * cue — one line, always on screen above the entry fields, for a movement with a
 *   real constraint. "Label: instruction" — the label is bolded by the app. Sourced
 *   from the hip rules in CLAUDE.md. A movement with no constraint has no cue.
 * guide — the "How to" disclosure: {setup, execute, watch}. Expands in place under
 *   the active exercise and never navigates away. Empty strings mean not written
 *   yet; the app falls back to how/why until they are.
 *
 * metric — how a set of this movement is measured. Exactly one of:
 *   weight_reps          external load x reps          e.g. barbell bench press
 *   bodyweight_reps      reps, no external load        e.g. glute bridge
 *   loaded_bodyweight    added load x reps             a bodyweight lift with a belt
 *   assisted_bodyweight  assistance load x reps        a bodyweight lift off a machine or band
 *   hold                 seconds                       e.g. RKC plank
 *   hold_each_side       seconds, left and right       e.g. couch stretch
 *   reps_only            reps, nothing else            band and mobility work
 *   duration             minutes                       walks, intervals, stretching
 *
 * The three bodyweight metrics are the rungs of one ladder, and a movement's
 * metric here is its ENTRY rung — where a new lifter starts. The rung the user
 * is actually on is remembered per exercise in settings.exMode and is the only
 * thing that decides what the log form asks for. The user's bodyweight is never
 * stored, displayed or folded into a load; assisted logs the assistance, added
 * logs what is hanging off the belt, and bodyweight logs reps alone.
 *
 * ladder — the gates for a bodyweight movement, so each one sets its own:
 *   modes         the rungs this movement offers, in order
 *   toBodyweight  {sets, reps, maxAssist} to clear the assisted rung
 *   toAdded       {sets, reps} to clear the bodyweight rung
 *   step, topReps add `step` lb once a top set reaches `topReps`
 * A met gate only ever prompts. Nothing advances a rung without the user saying so.
 */

/* ---------------- metrics ---------------- */
/* Not everything is weight × reps. Every exercise in the library carries a
 * metric, and that metric is the only thing that decides what the logger asks
 * for, what a stored set means, and how two sets of one movement compare.
 *
 * The three bodyweight metrics are the rungs of one ladder. Which rung a person
 * is on is theirs, not the library's, so it is remembered per exercise in
 * settings.exMode. Assisted logs the assistance, added logs what is hanging off
 * the belt, bodyweight logs reps and nothing else. The user's own bodyweight is
 * never stored, never shown as a load and never folded into one — there is no
 * effective-load number anywhere in this app. */
const RUNG_METRIC={assisted:'assisted_bodyweight',bodyweight:'bodyweight_reps',added:'loaded_bodyweight'};
const RUNG_OF={assisted_bodyweight:'assisted',bodyweight_reps:'bodyweight',loaded_bodyweight:'added'};
const RUNG_LABEL={assisted:'Assisted',bodyweight:'Bodyweight',added:'Added'};
const isBodyweight=m=>!!RUNG_OF[m];
/* Metrics that belong on the strength board. A hold, a rep count and a walk are
 * not loads and never appear there. */
const ON_BOARD=m=>m==='weight_reps'||isBodyweight(m);
const libMetric=n=>(LIB[n]||{}).metric||'weight_reps';
const ladderOf=n=>(LIB[n]||{}).ladder||null;
/* The rungs a movement offers. A bodyweight movement with no ladder — a glute
 * bridge — offers exactly the one it is. */
function rungsOf(n){const lad=ladderOf(n);if(lad&&lad.modes&&lad.modes.length)return lad.modes;const r=RUNG_OF[libMetric(n)];return r?[r]:[];}
/* The rung this person is on: what they last chose, else the library's entry rung. */
function rungOf(n){const rungs=rungsOf(n);if(!rungs.length)return null;const saved=(DB.settings.exMode||{})[n];return rungs.indexOf(saved)>=0?saved:(RUNG_OF[libMetric(n)]||rungs[0]);}
/* The metric a set logged right now would be written in. */
function metricOf(n){const m=libMetric(n);return isBodyweight(m)?(RUNG_METRIC[rungOf(n)]||m):m;}
function setRung(n,rung){DB.settings.exMode=DB.settings.exMode||{};DB.settings.exMode[n]=rung;}
/* Which exercise a stored log slot holds. The v4 migration cannot work this out
 * on its own — sets are stored under the day's slot index, not a name — so the
 * app hands it over. */
function exerciseAt(dateKey,slot){
  const d=new Date(dateKey+'T00:00:00');if(isNaN(d.getTime()))return null;
  const day=dayOf(d);if(!day||!day.ex)return null;
  const e=day.ex[+slot];if(!e)return null;
  return{name:e.n,metric:(LIB[e.n]||{}).metric||null};
}

/* A stored set as short text for its button. A set logged before metrics existed

/* ---------------- today ---------------- */
/* Every set of the most recent earlier session that logged this movement, in
 * order, so the previous outing can ghost under the name. */
function lastSession(exName,before){
  if(CHAINS){const k=Object.keys(DB.logs).filter(k=>k<key(before)).sort().reverse().find(k=>namedSets(k,exName).some(v=>v));return k?namedSets(k,exName).filter(v=>v):null;}
  const keys=Object.keys(DB.logs).filter(k=>k<key(before)).sort().reverse();
  for(const k of keys){const d=new Date(k+'T00:00:00');const day=dayOf(d);if(!day)continue;const i=day.ex.findIndex(e=>e.n===exName);
    if(i>=0&&DB.logs[k].sets[i]&&DB.logs[k].sets[i].some(v=>v))return DB.logs[k].sets[i].filter(v=>v);}
  return null;
}
/* Has this movement ever been logged, today included? The first time it
 * appears the name carries a "new" tag and How to is highlighted. */
function everLogged(exName){
  if(CHAINS)return Object.keys(DB.logs).some(k=>namedSets(k,exName).some(v=>v));
  for(const k in DB.logs){const d=new Date(k+'T00:00:00');const day=dayOf(d);if(!day)continue;const i=day.ex.findIndex(e=>e.n===exName);
    if(i>=0&&(DB.logs[k].sets[i]||[]).some(v=>v))return true;}
  return false;
}
/* The load the weight box opens on: what this session already logged for this
 * rung, else the last session's best at it. The prescription itself carries no
 * load, and a set from a different rung is a different number. */
function prescribedLoad(e,sets){
  const m=metricOf(e.n);const same=v=>v&&!v.skip&&(v.m===m||(!v.m&&m==='weight_reps'))&&v.w>0;
  /* Placement names the next set's weight outright, until it settles. */
  if(PLACE&&isLoaded(e.n)){const pl=placeOf(e.n);if(pl&&pl.active)return pl.w;}
  const today=(sets||[]).filter(same);
  if(today.length)return today[today.length-1].w;
  const prev=lastSession(e.n,cur);
  /* A weight she accepted after her last session is where the next one starts. */
  if(LOADS&&isLoaded(e.n)){const wk=workOf(e.n);const pk=lastSessionKey(e.n,cur);if(wk&&(!pk||wk.at>=pk))return wk.w;}
  if(prev){const best=bestOf(prev.filter(same));if(best)return best.w;}
  if(LOADS&&PROFILE.startLoads&&PROFILE.startLoads[e.n]!=null)return PROFILE.startLoads[e.n];
  return null;
}
/* The counted box opens on the prescription's first number — 8 for "8 / leg",
 * 10 for "10–12", tgt where the day template sets one. "max" opens empty. */
/* The profile's prescription, then whatever the features change on top of it.
 * With no feature on, this is rx() and nothing else. */
function rxOf(e,ph){const r=rx(e,ph);
  if(CARDIO&&e.runAhead&&r.tgt>0){const t=cardioTarget(e,r.tgt);if(t!==r.tgt){r.tgt=t;r.reps=`${t} min`;}}
  if(CHAINS){const x=extendOf(e);if(x){r.reps=`${x.lo}–${x.hi}`;r.note=[r.note,x.note].filter(Boolean).join(' · ');}}
  return r;}
function repsTarget(r){ if(r.tgt!=null)return r.tgt; const n=String(r.reps||'').match(/^\d+/); return n?+n[0]:null; }
/* The set the form is on for this exercise: the one being edited, else the
 * first not yet logged. null means every set is in. */
function setIndex(i,r,sets){ if(editing&&editing.ex===i)return editing.set; for(let s=0;s<r.sets;s++)if(!sets[s])return s; return null; }
/* The exercise the session is on: the one being edited, else the one the user
 * tapped, else the first with sets still to log. Only this one is a surface. */
function activeIndex(day,l,ph){
  if(editing)return editing.ex;
  if(activeEx!=null&&day.ex[activeEx])return activeEx;
  for(let i=0;i<day.ex.length;i++){const r=rxOf(day.ex[i],ph);if(setIndex(i,r,l.sets[i]||[])!=null)return i;}
  return null;
}
function guideOpen(i,name){ return false; }

/* The ladder, in a sentence: what the current rung has to do to clear its
 * gate. Every number comes from the library. */
function ladderLine(name,presc){
  const lad=ladderOf(name);if(!lad)return'';const rung=rungOf(name);let t='';
  const ns=n=>SCALED&&presc>0?Math.min(n,presc):n;
  if(rung==='assisted'&&lad.toBodyweight){const g=lad.toBodyweight;t=`${ns(g.sets)} set${ns(g.sets)===1?'':'s'} of ${g.reps} on ${g.maxAssist} lb of assistance or less unlocks <b>bodyweight</b>.`;}
  else if(rung==='bodyweight'&&lad.toAdded){const g=lad.toAdded;t=`${ns(g.sets)} set${ns(g.sets)===1?'':'s'} of ${g.reps} at bodyweight unlocks <b>added weight</b>.`;}
  else if(rung==='added'&&lad.topReps)t=LOADS?`A top set of ${lad.topReps} moves you up <b>one load step</b>.`:`A top set of ${lad.topReps} adds <b>${lad.step} lb</b> next time.`;
  const b=bestFor(name);
  return t?`<p class="ladder">${t}${b?` Best so far: ${esc(setPhrase(b))}.`:''}</p>`:'';
}

/* A collapsed exercise: one quiet line. Done shows the top set, upcoming shows
 * the prescription, skipped is struck through. */
function rowHtml(e,i,r,sets){
  const logged=[];let skipped=0;
  for(let s=0;s<r.sets;s++){const v=sets[s];if(!v)continue;if(isSkipped(v))skipped++;else logged.push(v);}
  const n=logged.length+skipped,done=r.sets>0&&n>=r.sets;
  let cls='',mark='○',val=rxLabel(e,r);
  if(done&&logged.length){cls='done';mark='✓';val=esc(setText(bestOf(logged))).replace('×',' × ');}
  else if(done){cls='skipped';mark='—';val='skipped';}
  else if(n>0){val=`${n} of ${r.sets}`;}
  return `<button class="row ${cls}" data-row="${i}"><span class="mark">${mark}</span><span class="name">${esc(e.n)}${e.alt?`<small>${esc(e.alt)}</small>`:''}</span><span class="val num">${val}</span></button>`+(n>0?promptHtml(promptsFor(e,i,r,sets)):'');
}

/* The entry fields, built from the metric. A movement with no external load
 * never gets a weight box — there is nothing true to put in it. A hold is
 * timed, a count is stepped, a walk is minutes. */
function entryHtml(e,v,r,sets){
  const m=metricOf(e.n),rungs=rungsOf(e.n),tgt=r.tgt;
  const field=(id,label,val,mode)=>`<div class="field"><label for="${id}">${label}</label><input type="number" inputmode="${mode||'numeric'}" id="${id}" value="${val??''}"></div>`;
  const tick=(id,label)=>`<button class="tick" data-hold="${id}">${label}</button>`;
  let h='',hint='';
  if(rungs.length>1)h+=`<div class="modes">${rungs.map(x=>`<button class="${rungOf(e.n)===x?'on':''}" data-rung="${x}" data-ex="${esc(e.n)}">${RUNG_LABEL[x]}</button>`).join('')}</div>`;
  h+=`<div class="entry">`;
  if(m==='hold'){
    h+=field('sf-sec','Seconds',v.sec??tgt)+tick('sf-sec','Start');
    hint='Start times the hold and leaves the seconds in the box.';
  }else if(m==='hold_each_side'){
    h+=field('sf-l','Left, s',v.left??tgt)+tick('sf-l','L')+field('sf-rt','Right, s',v.right??tgt)+tick('sf-rt','R');
    hint='Tap L or R to time that side.';
  }else if(m==='duration'){
    h+=field('sf-min','Minutes',v.min??tgt)+`<span class="unit">min</span>`;
    if(isCardioEx(e)){h+=field('sf-rpe','RPE 6–20',v.rpe??'');hint='How hard it felt, 6 (nothing) to 20 (all-out). 11–12 is an easy, chatty pace.';}
  }else if(m==='reps_only'||m==='bodyweight_reps'){
    h+=`<button class="step" data-repstep="-1">−</button>`+field('sf-r','Reps',v.r??repsTarget(r))+`<button class="step" data-repstep="1">+</button>`;
    if(m==='bodyweight_reps'&&rungs.length>1)hint='Bodyweight — reps only. Nothing added, nothing taken off.';
  }else if(m==='assisted_bodyweight'){
    h+=field('sf-w','Assist, lb',v.w??prescribedLoad(e,sets),'decimal')+`<span class="times">×</span>`+field('sf-r','Reps',v.r??repsTarget(r));
    hint='Log the assistance the machine or band is taking off.';
  }else if(m==='loaded_bodyweight'){
    h+=field('sf-w','Added, lb',v.w??prescribedLoad(e,sets),'decimal')+`<span class="times">×</span>`+field('sf-r','Reps',v.r??repsTarget(r));
    hint='Log what is hanging off the belt, not your bodyweight.';
  }else{
    h+=field('sf-w','Weight, lb',v.w??prescribedLoad(e,sets),'decimal')+`<span class="times">×</span>`+field('sf-r','Reps',v.r??repsTarget(r));
  }
  return h+`</div>`+(hint?`<div class="hint">${hint}</div>`:'');
}

/* The "How to" disclosure. It expands in place under the exercise and never
 * leaves the session; the demo link is the one thing here that does, and says
 * so. Until a guide is written the form cues stand in for it. */
function guideHtml(e,lib){
  const g=lib.guide||{};const parts=[];
  if(g.setup||g.execute||g.watch){
    if(g.setup)parts.push(['Set up',esc(g.setup)]);
    if(g.execute)parts.push(['Execute',esc(g.execute)]);

  }else if(lib.how&&lib.how.length)parts.push(['Form',`<ul>${lib.how.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`]);
  if(lib.why)parts.push(['Why',esc(lib.why)]);

  return `<div class="guide"><dl>${parts.map(([t,d])=>`<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl>${stdHtml(e)}
    <a class="watch" href="${yt(lib.yt||e.n+' proper form')}" target="_blank" rel="noopener"><span class="tri">▶</span><span>Watch the demo</span><span class="away">leaves Camp</span></a></div>`;
}

/* The active exercise. Compact on purpose: name, prescription, last time, the
 * set chips, the entry and Log fit in one phone screen. Everything longer —
 * the guide, history, skipping — opens in a sheet over the session. */
function activeHtml(e,i,r,sets){
  const lib=LIB[e.n]||{};const s=setIndex(i,r,sets);const v=(s!=null&&sets[s])||{};
  const isNew=!everLogged(e.n);
  const prev=lastSession(e.n,cur);
  const sub=[e.alt,e.rest&&e.rest!=='0'?`rest ${e.rest}`:''].filter(Boolean).join(' · ');
  let h=`<section class="active" id="active"><div class="top"><h2>${esc(e.n)}${isNew?`<span class="newtag">new</span>`:''}</h2><span class="rx num">${rxLabel(e,r)}</span></div>`;
  if(sub)h+=`<div class="alt">${esc(sub)}</div>`;
  h+=`<p class="prev">${prev?`Last time ${prev.map(x=>`<b class="num">${esc(setText(x)||'skip')}</b>`).join(' · ')}`:'First time in this program'}</p>`;
  if(r.note)h+=`<p class="note">${esc(r.note)}</p>`;
  if(LOADS)h+=featureNotes(e,r,sets,rangeOf(e,phaseOf(weekOf(cur))));
  if(lib.cue){const c=String(lib.cue);const k=c.indexOf(': ');h+=`<p class="cue"><span>${k>0?`<b>${esc(c.slice(0,k+1))}</b> ${esc(c.slice(k+2))}`:esc(c)}</span></p>`;}
  const closed=!!(DB.logs[key(cur)]||{}).done;const exSkipped=sets.some(isExSkip);
  if(r.sets>0){
    /* One chip per set: what was logged, or the set number. Tap to edit. */
    h+=`<div class="sets">`;
    for(let k=0;k<r.sets;k++){const x=sets[k];const cls=k===s?'here':x?(isSkipped(x)?'miss':'hit'):'';
      const val=x?(isSkipped(x)?'skip':esc(setText(x))):'—';
      h+=`<button class="${cls}" data-set="${i}:${k}" aria-label="Set ${k+1}${x?': '+val:''}">Set ${k+1}<b>${val}</b></button>`;}
    h+=`</div>`;
    if(s!=null){
      if(CHAINS&&e.slot){const cp=chainPicker(e,sets);if(cp)h+=`<div class="meta pick-l">Version</div>`+cp;}
      h+=entryHtml(e,v,r,sets);
      h+=`<button class="log" data-savesets="${i}:${s}">Log set ${s+1}</button>`;
    }
    h+=ladderLine(e.n,r.sets)+gateHtml(e,e.slot?sets.filter(v=>!v||(v.x||e.slot)===e.n):sets,r);
  }
  h+=promptHtml(promptsFor(e,i,r,sets));
  /* Secondary actions: one row, always visible under Log. */
  let aux=`<button class="${isNew?'hl':''}" data-how="${i}">How to</button><button data-hist="${i}">History</button>`;
  if(exSkipped&&!closed)aux+=`<button data-unskipex="${i}">Undo skip</button>`;
  else if(r.sets>0&&s!=null)aux+=`<button data-skipmenu="${i}:${s}">Skip…</button>`;
  /* With auto-start off the timer still has to be reachable, so the rest this
   * lift asks for gets its own button. A movement with no rest between rounds
   * — a walk, a warm-up, a mobility sequence — has none to offer. */
  if(r.sets>0&&!DB.settings.restAuto&&!e.warm&&e.t!=='C'){const rs=restSec(e.rest);if(rs)aux+=`<button data-startrest="${rs}">Rest ${clock(rs)}</button>`;}
  h+=`<div class="aux">${aux}</div>`;
  return h+`</section>`;
}

/* The strip: every exercise in the session as a chip, pinned to the top while
 * scrolling. Tap one to make it the active exercise. */
function stripHtml(day,l,ph,act){
  let h=`<div class="strip" id="strip" role="tablist">`;let wasWarm=null;
  day.ex.forEach((e,i)=>{
    if(CHAINS)e=effEx(e,l.sets[i]);
    const r=rxOf(e,ph);const sets=l.sets[i]||[];let n=0,sk=0;
    for(let k=0;k<r.sets;k++){const v=sets[k];if(!v)continue;n++;if(isSkipped(v))sk++;}
    const done=r.sets>0&&n>=r.sets;
    let cls=i===act?'on':'',mark=r.sets>0&&n>0&&!done?`${n}/${r.sets}`:'○';
    if(done&&sk===n){cls+=' skipped';mark='–';}else if(done){cls+=' done';mark='✓';}
    if(wasWarm&&!e.warm)h+=`<span class="sep"></span>`;wasWarm=!!e.warm;
    h+=`<button class="${cls}" data-row="${i}" role="tab" aria-selected="${i===act}"><i>${mark}</i><span>${esc(e.n)}</span></button>`;
  });
  return h+`</div>`;
}

/* What the rest bar points at: the set the form is on now. */
/* Read live on every tick, so it follows the user to another exercise. The
 * same exercise reads as just the set; a different one leads with its name. */
function nextLabel(){if(view!=='today')return'';const day=dayOf(cur);if(!day)return'';const l=DB.logs[key(cur)];if(!l)return'';const ph=phaseOf(weekOf(cur));const i=activeIndex(day,l,ph);if(i==null)return'';
  const e=CHAINS?effEx(day.ex[i],l.sets[i]):day.ex[i];const r=rxOf(e,ph);const s=setIndex(i,r,l.sets[i]||[]);if(s==null)return'';
  return i===restEx?`set ${s+1} of ${r.sets}`:`set ${s+1}, ${e.n}`;}
/* ---- the sheet ---- */
function openSheet(title,body){

/* Drag the panel down to dismiss, like any bottom sheet. Only from the top of its scroll. */
(function(){let y0=null,dy=0,panel=null;
  document.addEventListener('touchstart',e=>{const p=e.target.closest&&e.target.closest('#sheet .panel');if(!p||p.scrollTop>0){y0=null;return;}panel=p;y0=e.touches[0].clientY;dy=0;},{passive:true});
  document.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);if(dy>0){panel.classList.add('drag');panel.style.transform=`translateY(${dy}px)`;}},{passive:true});
  document.addEventListener('touchend',()=>{if(y0==null)return;panel.classList.remove('drag');if(dy>90)closeSheet();else panel.style.transform='';y0=null;});
})();
/* Android back closes an open sheet first. MainActivity asks before exiting. */

document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('#app input'))document.body.classList.add('typing');});
/* Wait before bringing the nav back: a tap on Log set blurs the box first, and

let typingT=null;

document.addEventListener('focusout',()=>{clearTimeout(typingT);typingT=setTimeout(()=>{if(!(document.activeElement&&document.activeElement.matches&&document.activeElement.matches('#app input')))document.body.classList.remove('typing');},300);});
function closeSheet(){const el=$('#sheet');el.classList.remove('up');el.setAttribute('aria-hidden','true');el.innerHTML='';}
/* Every earlier session that logged this movement, newest first. */
function historyOf(exName,before,max){
  const out=[];const keys=Object.keys(DB.logs).filter(k=>k<key(before)).sort().reverse();
  if(CHAINS){for(const k of keys){const ss=namedSets(k,exName).filter(v=>v);if(ss.length){out.push({k,sets:ss});if(out.length>=max)break;}}return out;}
  for(const k of keys){const d=new Date(k+'T00:00:00');const day=dayOf(d);if(!day)continue;const i=day.ex.findIndex(e=>e.n===exName);
    if(i>=0&&DB.logs[k].sets[i]&&DB.logs[k].sets[i].some(v=>v)){out.push({k,sets:DB.logs[k].sets[i].filter(v=>v)});if(out.length>=max)break;}}
  return out;
}
function historySheet(e){
  const rows=historyOf(e.n,cur,8);const best=bestFor(e.n);
  let b='';
  if(best)b+=`<p class="note" style="margin-top:0">Best so far: <b class="num">${esc(setPhrase(best))}</b></p>`;
  b+=rows.length?`<ul class="hist">${rows.map(x=>{const d=new Date(x.k+'T00:00:00');return `<li><span class="hd">${DOW[d.getDay()].slice(0,3)} ${MON[d.getMonth()]} ${d.getDate()}</span><span class="hs">${x.sets.map(v=>isSkipped(v)?'<span style="color:var(--ghost)">skip</span>':esc(setText(v))).join(' · ')}</span></li>`;}).join('')}</ul>`
    :`<p class="note" style="margin-top:0">Nothing logged before today.</p>`;
  openSheet(e.n+' — history',b);
}
function skipSheet(i,s,e){

}
/* Bring the active exercise to the top, under the strip, and centre its chip. */
function showActive(){requestAnimationFrame(()=>{

/* A met gate asks. It never moves anybody up on its own. */
function gateHtml(e,sets,r){
  const g=gateFor(e.n,sets,r&&r.sets);if(!g)return'';
  const id=e.n+'|'+key(cur)+'|'+(g.to||g.kind);

    <div class="g-b"><button data-gateyes="${esc(id)}">${esc(g.yes)}</button><button class="ghost" data-gateno="${esc(id)}">Not yet</button></div></div>`;
}

function vToday(){
  const w=weekOf(cur),ph=phaseOf(w);const day=dayOf(cur);const l=logFor(cur);const isToday=sameDay(cur,new Date());const inProg=inProgram(w);
  const end=START?addDays(START,WEEKS*7-1):null;const left=end?Math.round((end-cur)/864e5):0;
  let h=`<div class="today-nav"><button data-nav="-1">‹ Prev</button>${isToday?`<span class="meta">Today</span>`:`<button class="jump" data-jump="1">Back to today</button>`}<button data-nav="1">Next ›</button></div>`;
  /* Campaign header: where this day sits in a finite nine weeks. */
  if(LONG&&inProg){const pw=progWeek(w);const p=phaseAt(pw);const wl=p?p.endWeek-pw:0;

  h+=`<h1>${day.title}</h1><p class="date">${fmt(cur)} · ${day.when}</p>`;
  if(LONG){
    /* A year does not fit as one mark a week. One bar per phase, as wide as
     * its weeks, filled to where this week sits. */
    const pw=inProg?progWeek(w):0;
    h+=`<div class="track long" aria-label="${inProg?weekTitle(w):'The year'}">${PROFILE.phases.map(p=>{const len=p.endWeek-p.startWeek+1;const fill=pw>p.endWeek?100:pw<p.startWeek?0:Math.round((pw-p.startWeek+1)/len*100);
      return `<i class="${pw>=p.startWeek&&pw<=p.endWeek?'now':''}" style="flex:${len}"><b style="width:${fill}%"></b></i>`;}).join('')}</div>`;
  }else{
  let track='';for(let k=1;k<=WEEKS;k++)track+=`<i class="${inProg&&k<w?'past':inProg&&k===w?'now':''}"></i>`;
  const labs=[];for(let k=1;k<=WEEKS;k++){const p=phaseOf(k);if(p&&labs[labs.length-1]!==p)labs.push(p);}
  h+=`<div class="track" aria-label="${inProg?`Week ${w} of ${WEEKS}`:'The year'}">${track}</div><div class="track-lab">${labs.map(p=>`<span>${p}</span>`).join('')}</div>`;

  if(!inProg){const until=cur<START?Math.round((START-cur)/864e5):0;
    return h+`<div class="card"><h3>${cur<START?`Program starts Monday, ${MON[START.getMonth()]} ${START.getDate()}`:'Program complete'}</h3><p class="note">${cur<START?`Starts in ${until} day${until===1?'':'s'}. `+'Week 1 begins with Full Body A.':'52 weeks done. Your next plan comes next.'}</p></div>`;}

    h+=i===act?activeHtml(e,i,r,sets):rowHtml(e,i,r,sets);
  });
  h+=`</div>`;
  const logged=Object.values(l.sets||{}).some(a=>a&&a.some(v=>v));
  if(l.skipped){
    const note=skipNote(l.skipped);
    h+=`<div class="card skipped-card"><h3>Session skipped — ${esc(skipLabel(l.skipped.reason))}</h3>`+

        :(note?`<div class="skipnote">${esc(note)}</div>`:''))+

  }else{

    if(FLARE&&!l.done&&!logged)h+=`<button class="secondary" data-flare="1">Flare day — swap to ${esc(SESSIONS[PROFILE.flareSession].title.toLowerCase())}</button>`;

  return h;
}

function backupJSON(){return JSON.stringify({app:'camp',v:1,schemaVersion:CampCore.CURRENT_VERSION,exported:new Date().toISOString(),appVersion:BUILD_LABEL,data:{logs:DB.logs,weight:DB.weight,waist:DB.waist,hip:DB.hip,macros:DB.macros,quick:DB.quick,settings:DB.settings,app:DB.app}},null,1);}
function applyBackup(txt,mode){
  let o; try{o=JSON.parse(txt);}catch(e){return{ok:0,msg:'That is not valid backup text'};}
  let d=o&&o.data?o.data:o; if(!d||typeof d!=='object')return{ok:0,msg:'No data found in that backup'};
  /* Backups written before the storage layer existed have no schemaVersion, so
   * they are version 1. Bring them up to the current shape before merging. */
  const m=CampCore.migrate(d,(o&&typeof o.schemaVersion==='number')?o.schemaVersion:1,{exerciseAt,startDate:PROFILE.startDate});
  if(!m.ok)return{ok:0,msg:'That backup could not be read into this version of the app'};
  d=m.data;
  /* A restore runs the same migrations, so it reports the same way. */
  if(m.notes&&m.notes.length)DB.settings.dataNotes=(DB.settings.dataNotes||[]).concat(m.notes).slice(0,50);
  const fields=['logs','weight','waist','hip','macros'];
  let n=0;
  if(mode==='replace'){ fields.forEach(f=>{ if(d[f]&&typeof d[f]==='object'){DB[f]=d[f];n+=Object.keys(d[f]).length;} });
    if(Array.isArray(d.quick))DB.quick=d.quick; if(d.settings)DB.settings=Object.assign(DB.settings,d.settings);
    if(d.app&&typeof d.app==='object')DB.app=Object.assign({},DB.app,d.app); }
  else { fields.forEach(f=>{ if(d[f]&&typeof d[f]==='object'){ for(const k in d[f]){ if(!(k in DB[f])){DB[f][k]=d[f][k];n++;} } } });
    if(Array.isArray(d.quick)){ d.quick.forEach(q=>{ if(!DB.quick.some(x=>x.n===q.n))DB.quick.push(q); }); }
    if(d.settings)DB.settings=Object.assign({},d.settings,DB.settings);
    /* Merge fills only what is unset here: a start date already chosen on this device stays. */
    if(d.app&&typeof d.app==='object'){ for(const k in d.app){ if(DB.app[k]==null)DB.app[k]=d.app[k]; }
      /* The per-exercise maps merge entry by entry: what this device has wins. */
      for(const k of ['work','place','chain','cardio','waistSkip']){const src=d.app[k];if(src&&typeof src==='object'&&DB.app[k]&&DB.app[k]!==src){DB.app[k]=Object.assign({},src,DB.app[k]);}} } }
  applyStart(); applyNutrition(); save(); return{ok:1,msg:(mode==='replace'?'Restored ':'Merged ')+n+' records'};
}

function svgChart(){
  const ks=Object.keys(DB.weight).sort();if(ks.length<2)return GOAL?`<p class="note">Log a few days and the trend line appears here. Your goal: lose ${GOAL.low}–${GOAL.high} lb.</p>`:`<p class="note">Log a few days and the trend line appears here. Goal line is ${DB.settings.goalWeight} lb.</p>`;
  const origin=START||new Date(ks[0]+'T00:00:00');
  const pts=ks.map(k=>({x:Math.round((new Date(k+'T00:00:00')-origin)/864e5),y:DB.weight[k]}));const W=320,H=170,P=28;const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y).concat(GOAL?[]:[DB.settings.goalWeight]);
  let minX=Math.min(0,...xs),maxX=Math.max(START?WEEKS*7:0,...xs);
  /* A year of weigh-ins squeezed into one chart reads as a flat line. A long
   * program shows the last twelve weeks, which is the span that says anything. */
  if(LONG){maxX=Math.max(...xs)+7;minX=Math.max(Math.min(...xs),maxX-84);for(let i=pts.length-1;i>=0;i--)if(pts[i].x<minX)pts.splice(i,1);ys.length=0;pts.forEach(p=>ys.push(p.y));if(!GOAL)ys.push(DB.settings.goalWeight);}let minY=Math.floor(Math.min(...ys)-2),maxY=Math.ceil(Math.max(...ys)+2);
  const sx=x=>P+(x-minX)/(maxX-minX)*(W-2*P),sy=y=>H-P+(y-minY)/(maxY-minY)*-(H-2*P);
  const path=pts.map((p,i)=>`${i?'L':'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');const g=DB.settings.goalWeight;
  let h=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">`;
  /* SVG attributes take the tokens as hex: bone, dim, edge. */

  if(GOAL){/* The goal range as a band, where it falls inside the chart. */
    const top=Math.min(maxY,DB.settings.startWeight-GOAL.low),bot=Math.max(minY,DB.settings.startWeight-GOAL.high);
    if(top>bot)h+=`<rect x="${P}" y="${sy(top)}" width="${W-2*P}" height="${sy(bot)-sy(top)}" fill="#63CDAA" opacity=".12"/><text x="${W-P}" y="${sy(top)+12}" fill="#95ABA4" font-size="10" text-anchor="end">goal range</text>`;}
  else h+=`<line x1="${P}" y1="${sy(g)}" x2="${W-P}" y2="${sy(g)}" stroke="#88A199" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-P}" y="${sy(g)-4}" fill="#88A199" font-size="10" text-anchor="end">goal ${g}</text>`;
  h+=`<path d="${path}" fill="none" stroke="#ECE5D5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;pts.forEach(p=>{h+=`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="3" fill="#ECE5D5"/>`;});
  h+=`<text x="4" y="${sy(maxY)+4}" fill="#88A199" font-size="10">${maxY}</text><text x="4" y="${sy(minY)}" fill="#88A199" font-size="10">${minY}</text>`;
  return h+`</svg>`;
}

/* Builds a set out of whichever boxes the metric put on screen. Every set
 * stamps m, so it can always be read back without the day template. */
function readSet(name){
  const m=metricOf(name);
  const val=id=>{const el=$('#'+id);return el?parseFloat(el.value):NaN;};
  const pos=n=>!isNaN(n)&&n>0;
  if(m==='hold'){const sec=val('sf-sec');return pos(sec)?{set:{m,sec}}:{err:'Log the seconds, or tap Skip'};}
  if(m==='hold_each_side'){const a=val('sf-l'),b=val('sf-rt');return(pos(a)&&pos(b))?{set:{m,left:a,right:b}}:{err:'Log both sides, or tap Skip'};}
  if(m==='duration'){const min=val('sf-min');if(!pos(min))return{err:'Log the minutes, or tap Skip'};
    const rpe=val('sf-rpe');if(!isNaN(rpe)){if(rpe<6||rpe>20)return{err:'RPE runs from 6 to 20'};return{set:{m,min,rpe}};}
    return{set:{m,min}};}
  if(m==='reps_only'||m==='bodyweight_reps'){const r=val('sf-r');return pos(r)?{set:{m,r}}:{err:'Log the reps, or tap Skip'};}
  const r=val('sf-r'),w=val('sf-w');
  if(!pos(r))return{err:'Enter reps, or tap Skip'};
  if(m==='assisted_bodyweight')return pos(w)?{set:{m,w,r}}:{err:'Log the assistance, or switch to Bodyweight'};
  if(m==='loaded_bodyweight')return pos(w)?{set:{m,w,r}}:{err:'Log the added weight, or switch to Bodyweight'};
  return{set:{m:'weight_reps',w:isNaN(w)?null:w,r}};
}

/* A hold is timed, not counted. The stopwatch counts up into the box it was
 * started from and leaves the number there, editable like any other. */
const HOLD_LABEL={'sf-sec':'Start','sf-l':'L','sf-rt':'R'};
let holdT=null,holdStart=0,holdField=null;
function stopHold(){clearInterval(holdT);holdT=null;
  if(holdField){const b=$('[data-hold="'+holdField+'"]');if(b){b.textContent=HOLD_LABEL[holdField]||'Start';b.classList.remove('on');}holdField=null;}}
function tickHold(){const el=$('#'+holdField);if(!el){stopHold();return;}
  const n=Math.round((Date.now()-holdStart)/1000);el.value=n;
  const b=$('[data-hold="'+holdField+'"]');if(b){b.textContent=clock(n);b.classList.add('on');}}
function toggleHold(id){
  if(holdField===id){stopHold();return;}
  stopHold();holdField=id;holdStart=Date.now();tickHold();holdT=setInterval(tickHold,250);
}
/* Into whichever box the metric put first. */
function focusForm(){setTimeout(()=>{const f=$('#sf-w')||$('#sf-sec')||$('#sf-l')||$('#sf-min')||$('#sf-r');f&&f.focus();},0);}
function fallbackCopy(t,cb){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb();}catch(e){toast('Long-press the text to copy');}document.body.removeChild(ta);}
function readMeal(){const n=$('#m-n').value.trim(),p=+$('#m-p').value||0;if(SIMPLE){const kcal=Math.round(+$('#m-k').value||0);return{n,kcal,p};}const c=+$('#m-c').value||0,f=+$('#m-f').value||0;return{n,p,c,f};}
document.addEventListener('input',e=>{if(!SIMPLE&&['m-p','m-c','m-f'].includes(e.target.id)){const m=readMeal();$('#m-k').value=m.p*4+m.c*4+m.f*9||'';}});

  if(d.sharebackup&&!AND){const f=backupFile();if(f)navigator.share({files:[f],title:f.name}).catch(()=>{});return;}
  if(d.sharebackup){try{Camp.shareBackup(backupJSON(),'camp-backup-'+key(new Date())+'.json');}catch(e){toast('Share unavailable');}return;}
  if(d.pickbackup&&!AND){const inp=$('#pickfile');if(inp){inp.value='';inp.click();}return;}
  if(d.pickbackup){try{Camp.pickBackup();}catch(e){toast('Use paste instead');}return;}
  if(d.import){const t=($('#imp').value||'').trim();if(!t){toast('Paste a backup first');return;}
    if(d.import==='replace'&&!confirm('Replace everything currently in the app with this backup?'))return;
    const r=applyBackup(t,d.import);toast(r.msg);if(r.ok)render(true);return;}
  if(d.copyexp){const t=exportText();
    const done=()=>toast('Copied — paste it into a chat');
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}else fallbackCopy(t,done);
    return;}
  /* An edit is stored as an override on top of the profile, never written back
   * over the program's own numbers, so Use the program's targets can always put
   * them back and a later program change reaches anyone who never edited. */
  if(d.savetargets&&SIMPLE){
    const num=(id,was)=>{const v=parseFloat(($('#'+id)||{}).value);return isFinite(v)&&v>0?v:was;};
    const o={kcal:num('t-k',NUT.kcal),floorKcal:num('t-kf',NUT.floorKcal),protein:num('t-p',NUT.protein)};
    if(o.floorKcal>o.kcal){toast('Needs floor ≤ calories');return;}
    DB.app.nutrition=o;applyNutrition();save();render();toast('Targets saved');return;}
  if(d.savetargets){
    const num=(id,was)=>{const v=parseFloat(($('#'+id)||{}).value);return isFinite(v)&&v>0?v:was;};
    const o={trainingKcal:num('t-kt',NUT.trainingKcal),restKcal:num('t-kr',NUT.restKcal),floorKcal:num('t-kf',NUT.floorKcal),
      protein:num('t-p',NUT.protein),carbs:num('t-c',NUT.carbs),fat:num('t-f',NUT.fat)};
    if(o.floorKcal>o.restKcal||o.restKcal>o.trainingKcal){toast('Needs floor ≤ rest ≤ training');return;}
    DB.app.nutrition=o;applyNutrition();save();render();toast('Targets saved');return;}
  if(d.resettargets){delete DB.app.nutrition;applyNutrition();save();render();toast('Back to the program\'s targets');return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('up')){closeSheet();return;}if(e.key==='Enter'&&/^sf-/.test(e.target.id||'')){e.preventDefault();const b=$('[data-savesets]');b&&b.click();}});
render(true);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
if(!MIGRATION.ok){
  const bar=document.createElement('div');
  bar.className='warnbar';
  bar.innerHTML='<b>Your saved data was not updated.</b>'+esc(CampCore.FAIL_MESSAGE)+' Until then anything you log stays in memory only and is lost when you close the app.<br><button data-v="data">Open the Data tab</button>';
  document.body.insertBefore(bar,app);
}
</script>
</body>
